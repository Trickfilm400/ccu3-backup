# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Docker Build

on:
  workflow_dispatch:
  release:
    types:
      - published
env:
  REGISTRY: ghcr.io
#  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:
    runs-on: ubuntu-latest
#    permissions:
#      contents: read
#      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # Login against a Docker registry except on PR
        # https://github.com/docker/login-action
      - name: Log into registry #${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          #registry: ${{ env.REGISTRY }}
          #username: ${{ github.actor }}
          #password: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

        # Extract metadata (tags, labels) for Docker
        # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
        # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm:
    needs: build

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: lower-repo
        shell: pwsh
        env:
          INPUT: ${{ github.actor }}
        run: |
          "::set-output name=repository::$($env:INPUT.ToLowerInvariant())"
      - name: Run chart-releaser
        uses: bitdeps/helm-oci-charts-releaser@v0.1.5
        with:
          oci_registry: ${{ env.REGISTRY }}/${{ steps.lower-repo.outputs.repository }}/helm
          oci_username: ${{ steps.lower-repo.outputs.repository }}
          oci_password: ${{ secrets.GITHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_gh_release: true